# PostgreSQL + pgvector for the ledger and the tax-law RAG index (used from phase 1).
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
